name = "sns-hub"
main = "src/index.js"
compatibility_date = "2026-09-01"
# Cloudflare の管理画面で足した変数（OWNER_EMAILS など）を、デプロイで消さない
keep_vars = true

# 管理画面（public/）は build で Worker に埋め込んで配る（src/static.gen.js）
[build]
command = "node scripts/build-static.mjs"

[[d1_databases]]
binding = "DB"
database_name = "sns-hub"
database_id = "ce194243-879a-4dc3-aef1-500f4dc11221"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "sns-hub-media"

[triggers]
# 毎分：予約投稿の実行 ／ 毎日 18:00 UTC（日本時間 3:00）：Threads・Instagram のトークン延長
crons = ["* * * * *", "0 18 * * *"]

[vars]
# 公開URL。Instagram・Threads・LINE が画像を取りに来るので、予約投稿（cron）ではここを使う
PUBLIC_URL = "https://sns-hub.isozaki-f67.workers.dev" # 独自ドメインをつけたら差し替える
GRAPH_VERSION = "v23.0"
# Google ログイン（Firebase Authentication。90日外国語アプリと同じ french90days プロジェクト。Web 用の公開値）
FIREBASE_PROJECT_ID = "french90days"
FIREBASE_API_KEY = "AIzaSyALxNcusytqt--Rq8yznBWuIniQY2ZKFCo"
FIREBASE_AUTH_DOMAIN = "french90days.firebaseapp.com"

# 秘密情報は `wrangler secret put` で入れる：
#   ADMIN_PASSWORD  管理画面の合言葉
#   APP_SECRET      ログインの署名と、各SNSの鍵の暗号化に使う（長いランダム文字列）
