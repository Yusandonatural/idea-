<style>
:root{
  --bg:#f7f5f0;--bg2:#ffffff;--ink:#1f1d1a;--ink2:#5c5852;--line:#e4dfd5;
  --accent:#b23a2e;--accent2:#f3dcd8;--ok:#2d7a4f;--ok2:#dcefe3;--warn:#8a6d1f;--warn2:#f6ecc9;
  --radius:12px;--max:1080px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#17161a;--bg2:#211f24;--ink:#f0ede6;--ink2:#a7a19a;--line:#36333a;
  --accent:#e6675a;--accent2:#3d2420;--ok:#5fc48a;--ok2:#1f3a2c;--warn:#e2c35a;--warn2:#3a3220;}}
:root[data-theme="dark"]{
  --bg:#17161a;--bg2:#211f24;--ink:#f0ede6;--ink2:#a7a19a;--line:#36333a;
  --accent:#e6675a;--accent2:#3d2420;--ok:#5fc48a;--ok2:#1f3a2c;--warn:#e2c35a;--warn2:#3a3220;}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Hiragino Sans","Noto Sans JP","Noto Sans CJK SC","PingFang SC",sans-serif;line-height:1.7;font-size:16px}
a{color:var(--accent)}
header{position:sticky;top:0;z-index:10;background:var(--bg2);border-bottom:1px solid var(--line)}
.wrap{max-width:var(--max);margin:0 auto;padding:0 16px}
.brand{display:flex;align-items:center;justify-content:space-between;padding:10px 0;gap:12px}
.brand h1{font-size:17px;margin:0;letter-spacing:.02em}
.brand h1 small{display:block;font-size:11px;color:var(--ink2);font-weight:normal}
nav{display:flex;gap:4px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{white-space:nowrap;text-decoration:none;color:var(--ink2);padding:6px 12px;border-radius:999px;font-size:14px}
nav a.on{background:var(--accent2);color:var(--accent);font-weight:600}
main{padding:20px 0 60px}
h2{font-size:22px;margin:8px 0 12px}
h3{font-size:17px;margin:20px 0 8px}
.muted{color:var(--ink2);font-size:14px}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin:12px 0}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.zh{font-size:24px;font-weight:600;line-height:1.5;font-family:"Noto Sans SC","Noto Sans CJK SC","PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif}
.zh.lg{font-size:30px}
.py{color:var(--accent);font-size:15px;letter-spacing:.01em}
.ja{color:var(--ink2);font-size:14px}
.hide-py .py{display:none}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--accent2);color:var(--accent);margin-right:6px}
.tag.ok{background:var(--ok2);color:var(--ok)}
.tag.warn{background:var(--warn2);color:var(--warn)}
.tag.grey{background:var(--line);color:var(--ink2)}
button,.btn{font:inherit;border:1px solid var(--line);background:var(--bg2);color:var(--ink);padding:8px 14px;border-radius:10px;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button.ok{background:var(--ok);border-color:var(--ok);color:#fff}
button.small{padding:4px 10px;font-size:13px}
button:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bar{height:10px;background:var(--line);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);width:0}
.week{display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:start}
.week .n{font-size:26px;font-weight:700;color:var(--accent);line-height:1}
.week .n small{display:block;font-size:11px;color:var(--ink2);font-weight:normal}
.ex{border-left:3px solid var(--line);padding:6px 12px;margin:8px 0}
.ex .zh{font-size:19px;font-weight:500;white-space:pre-line}
.slots{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.slots span{border:1px dashed var(--line);border-radius:8px;padding:2px 8px;font-size:14px}
.drill{ text-align:center;padding:28px 16px}
.drill .ja{font-size:18px;color:var(--ink)}
.drill .ans{margin-top:16px;min-height:80px}
details{border:1px solid var(--line);border-radius:var(--radius);padding:10px 14px;margin:8px 0;background:var(--bg2)}
summary{cursor:pointer;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:15px}
td,th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:13px;color:var(--ink2);font-weight:600}
.pill-list{display:flex;flex-wrap:wrap;gap:6px}
.pill-list a{display:inline-block;text-decoration:none;color:var(--ink);background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:13px}
.pill-list a.on{background:var(--accent2);color:var(--accent);border-color:transparent}
.timeline{list-style:none;margin:0;padding:0}
.timeline li{display:grid;grid-template-columns:56px 1fr auto;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
.timeline .m{font-weight:700;color:var(--accent)}
.timeline .m small{display:block;font-size:11px;color:var(--ink2);font-weight:normal}
.timeline .w{font-size:14px;color:var(--ink2)}
.timeline .nm{font-weight:600;color:var(--ink)}
.timeline li.done{opacity:.55}
.timeline li.done .nm::after{content:" ✓";color:var(--ok)}
.notice{background:var(--warn2);color:var(--warn);padding:10px 14px;border-radius:10px;font-size:14px}
.spk{border:none;background:transparent;color:var(--accent);font-size:18px;padding:0 6px;cursor:pointer;vertical-align:middle}
footer{border-top:1px solid var(--line);padding:16px 0;color:var(--ink2);font-size:12px}
@media (max-width:600px){.zh{font-size:21px}.zh.lg{font-size:26px}.week{grid-template-columns:44px 1fr}}

<script src="data/curriculum.js"></script>
<script src="data/grammar.js"></script>
<script src="data/patterns.js"></script>
<script src="data/homophones.js"></script>
<script src="data/vocab.js"></script>
<script>
(function(){
"use strict";
const $ = s => document.querySelector(s);
const app = $("#app");
const esc = s => String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const P = Object.fromEntries(PATTERNS.map(p=>[p.id,p]));
const G = Object.fromEntries(GRAMMAR.map(g=>[g.id,g]));
const H = Object.fromEntries(HOMOPHONES.map(h=>[h.id,h]));
const DAY = 86400000;

// ---------- 永続化（localStorage。失敗しても動く） ----------
const store = {
  get(){ try{ return JSON.parse(localStorage.getItem("zh3m")||"{}"); }catch(e){ return {}; } },
  set(v){ try{ localStorage.setItem("zh3m",JSON.stringify(v)); }catch(e){} }
};
let S = Object.assign({ start:null, done:{}, mastery:{}, pinyin:true, theme:null, lastDrill:{} }, store.get());
const save = () => store.set(S);

function applyPrefs(){
  document.body.classList.toggle("hide-py", !S.pinyin);
  if(S.theme) document.documentElement.setAttribute("data-theme",S.theme); else document.documentElement.removeAttribute("data-theme");
}
$("#pyToggle").onclick = ()=>{ S.pinyin=!S.pinyin; save(); applyPrefs(); };
$("#themeToggle").onclick = ()=>{ const dark = matchMedia("(prefers-color-scheme:dark)").matches; const cur = S.theme || (dark?"dark":"light"); S.theme = cur==="dark"?"light":"dark"; save(); applyPrefs(); };
applyPrefs();

// ---------- 日付と進捗 ----------
function todayKey(d){ d=d||new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function dayIndex(){ if(!S.start) return 0; const s=new Date(S.start+"T00:00:00"); return Math.max(0, Math.floor((Date.now()-s.getTime())/DAY)); }
function curWeek(){ return Math.min(12, Math.floor(dayIndex()/7)+1); }
function dayOfWeek(){ return dayIndex()%7; } // 0..6, 5,6 = 週末
function doneCount(){ return Object.keys(S.done).length; }

// ---------- 音声（Web Speech API） ----------
function speak(text){
  if(!("speechSynthesis" in window)) return alert("このブラウザは音声読み上げに対応していません。");
  const u = new SpeechSynthesisUtterance(text.replace(/〔|〕/g,"").replace(/【.*?】/g,""));
  const v = speechSynthesis.getVoices().find(v=>/^zh[-_]?(CN|Hans)?/i.test(v.lang)) || speechSynthesis.getVoices().find(v=>/^zh/i.test(v.lang));
  if(v) u.voice=v; u.lang="zh-CN"; u.rate=0.85;
  speechSynthesis.cancel(); speechSynthesis.speak(u);
}
window.__speak = speak;
const spk = t => `<button class="spk" onclick="__speak(${JSON.stringify(t).replace(/"/g,"&quot;")})" aria-label="読み上げ">🔊</button>`;

// ---------- 部品 ----------
const exHtml = e => `<div class="ex"><div class="zh">${esc(e.zh)} ${spk(e.zh)}</div><div class="py">${esc(e.py)}</div><div class="ja">${esc(e.ja)}</div></div>`;
function patternCard(p, compact){
  const g = G[p.grammar];
  return `<div class="card" id="${p.id}">
    <div class="row" style="justify-content:space-between"><span><span class="tag">第${p.week}週</span><span class="tag grey">${esc(g?g.title:"")}</span></span>
      <span class="tag ${S.mastery[p.id]>=3?"ok":"grey"}">${S.mastery[p.id]?"習熟 "+S.mastery[p.id]+"/3":"未着手"}</span></div>
    <div class="zh lg">${esc(p.zh)} ${p.py!=="—"?spk(p.zh):""}</div>
    <div class="py">${esc(p.py)}</div>
    <div class="ja">${esc(p.ja)}</div>
    ${p.slots.length?`<div class="muted" style="margin-top:8px">差し替え語</div><div class="slots">${p.slots.map(s=>`<span>${esc(s[0])} <span class="py">${esc(s[1])}</span> <span class="ja">${esc(s[2])}</span></span>`).join("")}</div>`:""}
    ${compact?"":p.ex.map(exHtml).join("")}
    <div class="row" style="margin-top:8px"><a class="btn" href="#/drill/${p.id}">この文型をドリル</a><a class="btn" href="#/grammar/${p.grammar}">文法を見る</a></div>
  </div>`;
}
function grammarCard(g, open){
  return `<details id="${g.id}" ${open?"open":""}><summary><span class="tag grey">${esc(g.cat)}</span>${esc(g.title)}</summary>
    <div class="zh" style="font-size:18px;margin:8px 0">${esc(g.form)}</div>
    <p>${esc(g.explain)}</p>
    ${g.ex.map(exHtml).join("")}
    ${g.pitfalls?`<div class="notice">⚠ ${esc(g.pitfalls)}</div>`:""}
    <div class="pill-list" style="margin-top:10px">${PATTERNS.filter(p=>p.grammar===g.id).map(p=>`<a href="#/patterns/${p.id}">${esc(p.zh)}</a>`).join("")}</div>
  </details>`;
}
function homophoneCard(h){
  const label = {tone:"声調違い",same:"完全同音",multi:"多音字"}[h.type];
  return `<div class="card" id="${h.id}"><span class="tag ${h.type==="tone"?"":h.type==="same"?"warn":"ok"}">${label}</span><strong>${esc(h.title)}</strong>
    <table style="margin-top:8px">${h.items.map(i=>`<tr><td class="zh" style="font-size:20px">${esc(i[0])} ${spk(i[0])}</td><td class="py">${esc(i[1])}</td><td class="ja">${esc(i[2])}</td></tr>`).join("")}</table>
    <div class="muted" style="margin-top:8px">練習：${esc(h.drill)}</div></div>`;
}

// ---------- 画面 ----------
const views = {};

views.today = function(){
  if(!S.start){
    return `<h2>今日の60分</h2>
      <div class="card"><p>開始日を記録すると、12週分の「今日やること」が自動で出ます。1日60分、平日は5ブロック、週末は4ブロックの固定メニューです。</p>
      <div class="row"><button class="primary" id="startBtn">今日から始める</button></div></div>
      ${dailyRules()}`;
  }
  const w = curWeek(), d = dayOfWeek(), wk = CURRICULUM[w-1];
  const weekend = d>=5;
  const plan = weekend ? DAILY_PLAN.weekend : DAILY_PLAN.weekday;
  const key = todayKey();
  const doneToday = S.done[key] || {};
  // 平日: 文法1つ・文型1つを日替わりで割当
  const gi = Math.min(d, wk.grammar.length-1), pi = Math.min(d, wk.patterns.length-1);
  const gId = wk.grammar[gi], pId = wk.patterns[pi];
  const items = plan.map((b,i)=>{
    let link = "";
    if(b.mode==="grammar") link = `#/grammar/${weekend?wk.grammar[0]:gId}`;
    if(b.mode==="drill") link = `#/drill/${pId}`;
    if(b.mode==="review") link = `#/drill/review`;
    if(b.mode==="homophones") link = `#/sounds/${w}`;
    if(b.mode==="scene") link = `#/plan/${w}`;
    const ok = !!doneToday[i];
    return `<li class="${ok?"done":""}"><div class="m">${b.min}<small>分</small></div>
      <div><div class="nm">${esc(b.name)}</div><div class="w">${esc(b.what)}</div>${link?`<a href="${link}">開く →</a>`:""}</div>
      <button class="small ${ok?"":"ok"}" data-done="${i}">${ok?"戻す":"完了"}</button></li>`;
  }).join("");
  const total = plan.reduce((a,b)=>a+b.min,0);
  const doneMin = plan.reduce((a,b,i)=>a+(doneToday[i]?b.min:0),0);
  const pct = Math.round(doneCount()/84*100);
  return `<h2>今日の60分 <span class="tag">第${w}週 ${weekend?"週末":"第"+(d+1)+"日"}</span></h2>
    <div class="card">
      <div class="row" style="justify-content:space-between"><strong>${esc(wk.title)}</strong><span class="muted">${esc(wk.phase)}</span></div>
      <div class="muted">今週のゴール：${esc(wk.goal)}　／　シーン：${esc(wk.scene)}</div>
      <div style="margin:10px 0 4px" class="muted">今日の進み：${doneMin}/${total}分</div>
      <div class="bar"><i style="width:${Math.round(doneMin/total*100)}%"></i></div>
      <ul class="timeline" style="margin-top:8px">${items}</ul>
      ${weekend?"":`<div class="muted" style="margin-top:10px">今日の文法：<a href="#/grammar/${gId}">${esc(G[gId].title)}</a>　／　今日の文型：<a href="#/patterns/${pId}">${esc(P[pId].zh)}</a></div>`}
    </div>
    <div class="card"><div class="row" style="justify-content:space-between"><strong>3ヶ月の進捗</strong><span class="muted">${doneCount()} / 84 セッション完了（${pct}%）・開始 ${S.start}</span></div>
      <div class="bar" style="margin-top:8px"><i style="width:${pct}%"></i></div>
      <div class="row" style="margin-top:10px"><a class="btn" href="#/plan">12週の全体を見る</a><button class="small" id="resetBtn">記録をリセット</button></div></div>
    ${dailyRules()}`;
};
function dailyRules(){ return `<details><summary>1日60分で回すためのルール</summary><ul>${DAILY_PLAN.rules.map(r=>`<li>${esc(r)}</li>`).join("")}</ul></details>`; }

views.sounds = function(arg){

// ---------- ドリル ----------
let drill = null;
function buildDrill(arg){
  let pats;
  if(arg==="review"){
    const due = PATTERNS.filter(p=>p.slots.length && (S.mastery[p.id]||0)<3 && p.week<=curWeek());
    pats = due.length?due:PATTERNS.filter(p=>p.slots.length);
  } else if(arg && P[arg]) pats=[P[arg]];
  else pats = PATTERNS.filter(p=>p.slots.length && p.week<=Math.max(1,curWeek()));
  const items = [];
  pats.forEach(p=>{
    p.slots.forEach(s=>{
      // 〔…〕を差し替え語で置換（複数スロットは " / " 区切り）
      const parts = s[0].split(" / "), pyParts = s[1].split(" / "), jaParts = s[2].split("／");
      let zh=p.zh, py=p.py, ja=p.ja, i=0, j=0, k=0;
      zh = zh.replace(/〔[^〕]*〕/g, ()=>parts[Math.min(i++,parts.length-1)]).replace(/〔〕/g,"");
      py = py.replace(/\[[^\]]*\]/g, ()=>pyParts[Math.min(j++,pyParts.length-1)]);
      ja = s[3] ? s[3] : ja.replace(/〔[^〕]*〕/g, ()=>jaParts[Math.min(k++,jaParts.length-1)]);
      items.push({pid:p.id, zh, py, ja});
    });
    p.ex.forEach(e=>{ if(!e.zh.includes("\n")) items.push({pid:p.id, zh:e.zh, py:e.py, ja:e.ja}); });
  });
  for(let i=items.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [items[i],items[j]]=[items[j],items[i]]; }
  return { arg, items: items.slice(0, arg==="review"?20:12), i:0, shown:false, ok:0, ng:0 };
}
views.drill = function(arg){
  if(!drill || drill.arg!==arg || drill.i>=drill.items.length) drill = buildDrill(arg);
  if(!drill.items.length) return `<h2>ドリル</h2><p>この文型には差し替え語がありません。</p><a class="btn" href="#/patterns">文型一覧へ</a>`;
  const it = drill.items[drill.i];
  const title = arg==="review"?"復習ドリル":(P[arg]?"文型ドリル":"今週までの総合ドリル");
  return `<h2>${title} <span class="tag">${drill.i+1} / ${drill.items.length}</span></h2>
    <div class="pill-list"><a href="#/drill" class="${!arg?"on":""}">今週まで</a><a href="#/drill/review" class="${arg==="review"?"on":""}">復習（未習熟）</a><a href="#/patterns/${it.pid}">文型を確認</a></div>
    <div class="card drill">
      <div class="muted">日本語を見て、中国語を声に出してから「答えを見る」</div>
      <div class="ja" style="margin-top:12px">${esc(it.ja)}</div>
      <div class="ans">${drill.shown?`<div class="zh lg">${esc(it.zh)} ${spk(it.zh)}</div><div class="py">${esc(it.py)}</div>`:""}</div>
      <div class="row" style="justify-content:center;margin-top:10px">
        ${drill.shown?`<button class="ok" data-judge="1">言えた</button><button data-judge="0">もう一回</button>`:`<button class="primary" id="showBtn">答えを見る</button>`}
      </div>
    </div>
    <div class="muted">正答 ${drill.ok} ／ 要復習 ${drill.ng}。「言えた」が3回たまると習熟済みになります。</div>`;
};

views.about = function(){
  return `<h2>この教材について</h2>

// ---------- ルーティング ----------
function route(){
  const h = location.hash.replace(/^#\/?/,"") || "today";
  const [name, arg] = h.split("/");
  const fn = views[name] || views.today;
  app.innerHTML = fn(arg);
  document.querySelectorAll("#nav a").forEach(a=>a.classList.toggle("on", a.getAttribute("href")==="#/"+name));
  window.scrollTo(0,0);
  if(arg){ const el=document.getElementById(arg); if(el){ el.scrollIntoView({block:"start"}); } }
  if(window.trackPageView) trackPageView("/"+name+(arg?"/"+arg:""), document.title);
  bind(name,arg);
}
function bind(name,arg){
  const start = $("#startBtn"); if(start) start.onclick=()=>{ S.start=todayKey(); save(); route(); };
  const reset = $("#resetBtn"); if(reset) reset.onclick=()=>{ if(confirm("学習記録（開始日・完了・習熟）を消します。よろしいですか？")){ S={start:null,done:{},mastery:{},pinyin:S.pinyin,theme:S.theme,lastDrill:{}}; save(); route(); } };
  document.querySelectorAll("[data-done]").forEach(b=>b.onclick=()=>{
    const k=todayKey(); S.done[k]=S.done[k]||{}; const i=b.dataset.done;
    if(S.done[k][i]) delete S.done[k][i]; else S.done[k][i]=1;
    const plan = dayOfWeek()>=5?DAILY_PLAN.weekend:DAILY_PLAN.weekday;
    const all = plan.every((_,j)=>S.done[k][j]);
    if(Object.keys(S.done[k]).length===0) delete S.done[k];
    save(); route();
    if(all && window.trackConversion) trackConversion("app_action_complete",{site:"zh3m",action:"session_complete",week:curWeek()});
  });
  const show = $("#showBtn"); if(show) show.onclick=()=>{ drill.shown=true; route(); };
  document.querySelectorAll("[data-judge]").forEach(b=>b.onclick=()=>{
    const it = drill.items[drill.i]; const ok = b.dataset.judge==="1";
    if(ok){ drill.ok++; S.mastery[it.pid]=Math.min(3,(S.mastery[it.pid]||0)+1); } else { drill.ng++; S.mastery[it.pid]=Math.max(0,(S.mastery[it.pid]||0)-1); drill.items.push(it); }
    save(); drill.i++; drill.shown=false;
    if(drill.i>=drill.items.length){ const r=drill; drill=null; app.innerHTML=`<h2>ドリル完了</h2><div class="card"><p>正答 ${r.ok} ／ 要復習 ${r.ng}</p><div class="row"><a class="btn" href="#/drill/${arg||""}" onclick="location.reload()">もう一度</a><a class="btn" href="#/today">今日の60分へ戻る</a></div></div>`; if(window.trackConversion) trackConversion("app_action_complete",{site:"zh3m",action:"drill_complete",ok:r.ok,ng:r.ng}); return; }
    route();
  });
}
window.addEventListener("hashchange", route);
if("speechSynthesis" in window) speechSynthesis.onvoiceschanged = ()=>{};
route();
})();
